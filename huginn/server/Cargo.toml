[package]
name = "huginn-server"
description = "Huginn's server: its data model and API on top of raven-server."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "huginn-server"
path = "src/main.rs"

[dependencies]
raven-core = { workspace = true }
raven-server = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
yrs = "0.28"
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"

[dev-dependencies]
tempfile = "3"
