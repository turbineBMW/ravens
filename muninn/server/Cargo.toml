axum = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
tracing = { workspace = true }
yrs = "0.28"
serde = { workspace = true }
web-push = { version = "0.11", features = ["hyper-client"] }
chrono-tz = "0.10"
p256 = "0.13"
