<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="color-scheme" content="light dark" />
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#24282f" />
        <meta name="mobile-web-app-capable" content="yes" />
        <title>Muninn</title>
        <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 32x32 48x48" />
        <link rel="icon" href="%sveltekit.assets%/icon-192.png" type="image/png" sizes="192x192" />
        <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
        <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
        <script>
            // Chrome offers the install early, often before the app mounts; keep it for the settings menu.
            addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                window.__installPrompt = e;
                dispatchEvent(new Event('ravens-installable'));
            });
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
