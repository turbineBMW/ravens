# Build both images from a copy of the repo instead of pulling them. Use
# scripts/deploy-mini.sh, which runs this and sets RAVEN_VERSION to the commit.
services:
    huginn:
        build:
            context: ..
            args: { APP: huginn, RAVEN_VERSION: "${RAVEN_VERSION:-dev}" }
    muninn:
        build:
            context: ..
            args: { APP: muninn, RAVEN_VERSION: "${RAVEN_VERSION:-dev}" }
